{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block body %}
<div class="min-h-screen flex items-center justify-center p-6 relative">
    <!-- Background orbs -->
    <div class="absolute top-1/3 left-1/4 w-80 h-80 rounded-full blur-3xl pointer-events-none"
        style="background:rgba(26,50,99,0.25);"></div>
    <div class="absolute bottom-1/3 right-1/4 w-64 h-64 rounded-full blur-3xl pointer-events-none"
        style="background:rgba(250,185,91,0.07);"></div>

    <div class="w-full max-w-lg relative z-10">
        <!-- Back -->
        <a href="{{ url_for('landing') }}"
            class="inline-flex items-center gap-2 text-sm mb-8 transition-all hover:opacity-100 opacity-60"
            style="color:var(--accent-steel);">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg>
            Back to Firma-KI
        </a>

        <!-- Form Card -->
        <div class="glass-card p-8 glow">
            <div class="text-center mb-8">
                <div class="w-14 h-14 rounded-xl flex items-center justify-center mx-auto mb-4"
                    style="background:var(--gradient-primary);">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                        style="color:var(--text-inverse);">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                </div>
                <h1 class="text-2xl font-bold mb-2" style="color:var(--text-primary);">Create Your Organization</h1>
                <p class="text-sm" style="color:var(--text-muted);">Start slashing AI costs in under 2 minutes.</p>
            </div>

            {% if error %}
            <div class="mb-6 p-4 rounded-xl"
                style="background:rgba(248,113,113,0.08); border:1px solid rgba(248,113,113,0.25);">
                <p class="text-sm" style="color:var(--accent-red);">{{ error }}</p>
            </div>
            {% endif %}

            <form method="post" class="space-y-4">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token else '' }}">
                <div>
                    <label class="block text-sm font-medium mb-2" style="color:var(--text-secondary);">Organization Name</label>
                    <input type="text" name="organization_name" required
                        class="w-full px-4 py-3 rounded-xl fi-input font-mono text-sm"
                        style="background:var(--bg-input); border:1px solid var(--border-input); color:var(--text-primary);"
                        placeholder="e.g. Acme Corp">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium mb-2" style="color:var(--text-secondary);">First Name</label>
                        <input type="text" name="first_name" required
                            class="w-full px-4 py-3 rounded-xl fi-input font-mono text-sm"
                            style="background:var(--bg-input); border:1px solid var(--border-input); color:var(--text-primary);"
                            placeholder="Max">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2" style="color:var(--text-secondary);">Last Name</label>
                        <input type="text" name="last_name" required
                            class="w-full px-4 py-3 rounded-xl fi-input font-mono text-sm"
                            style="background:var(--bg-input); border:1px solid var(--border-input); color:var(--text-primary);"
                            placeholder="Mustermann">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2" style="color:var(--text-secondary);">Username</label>
                    <input type="text" name="username" required
                        class="w-full px-4 py-3 rounded-xl fi-input font-mono text-sm"
                        style="background:var(--bg-input); border:1px solid var(--border-input); color:var(--text-primary);"
                        placeholder="admin_acme">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2" style="color:var(--text-secondary);">Email</label>
                    <input type="email" name="email" required
                        class="w-full px-4 py-3 rounded-xl fi-input font-mono text-sm"
                        style="background:var(--bg-input); border:1px solid var(--border-input); color:var(--text-primary);"
                         placeholder="admin@acme.com">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium mb-2" style="color:var(--text-secondary);">Password</label>
                        <input type="password" name="password" required
                            class="w-full px-4 py-3 rounded-xl fi-input font-mono text-sm"
                            style="background:var(--bg-input); border:1px solid var(--border-input); color:var(--text-primary);"
                             placeholder="••••••••">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2" style="color:var(--text-secondary);">Confirm Password</label>
                        <input type="password" name="password_confirm" required
                            class="w-full px-4 py-3 rounded-xl fi-input font-mono text-sm"
                            style="background:var(--bg-input); border:1px solid var(--border-input); color:var(--text-primary);"
                             placeholder="••••••••">
                    </div>
                </div>
                <button type="submit" class="btn-gradient w-full py-3 mt-4 text-center"
                    style="color:var(--text-primary);">
                    Create Organization →
                </button>
            </form>

            <p class="text-center text-sm mt-6" style="color:var(--text-muted);">
                Already have an account? <a href="{{ url_for('accounts_login') }}"
                    class="font-semibold transition-colors hover:opacity-100 opacity-80"
                    style="color:var(--accent-navy);">Log in</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
